name: Auto release

on:
  push:
    branches: [main]
    paths-ignore:
      - VERSION.md

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choose the next version
        id: version
        shell: bash
        run: |
          release_date="$(TZ=Asia/Shanghai date +%Y.%m.%d)"
          last_number="$(git tag --list "v${release_date}.*" | sed -E 's/.*\.([0-9]+)$/\1/' | sort -n | tail -1)"
          next_number="$(( ${last_number:-0} + 1 ))"
          echo "version=v${release_date}.${next_number}" >> "$GITHUB_OUTPUT"
          echo "released_at=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')" >> "$GITHUB_OUTPUT"

      - name: Write version proof
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASED_AT: ${{ steps.version.outputs.released_at }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cat > VERSION.md <<EOF
          # Skill 版本证明

          - Version: ${VERSION}
          - Released: ${RELEASED_AT}
          - Source commit: ${SOURCE_COMMIT}
          - Repository: https://github.com/wuhuili2014/productize-me

          用户验证时，请让 Agent 同时读取 GitHub 当前的本文件和本地已安装目录中的本文件；只有 Version 与 Source commit 都一致，才表示更新成功。
          EOF

      - name: Commit version proof and create tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.md
          git commit -m "release ${VERSION} [skip ci]"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin HEAD:main "$VERSION"

      - name: Build verifiable Skill package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=zip --prefix=liz-experience-product-coach/ -o liz-experience-product-coach.zip "$VERSION"
          sha256sum liz-experience-product-coach.zip > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            liz-experience-product-coach.zip \
            SHA256SUMS \
            --title "$VERSION" \
            --notes "由 GitHub 在 main 分支更新后自动生成。安装包内的 VERSION.md 可用于核对实际安装版本。"
